name: CrismaQuest CI

on:
  push:
    branches:
      - crismaquest-mvp
      - 'feature/**'
      - '!feature/crismaquest-auth-final'
      - 'staging/**'
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  php-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl
          tools: composer:v2
      - name: Validate Composer
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax check
        run: find src public routes config -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check sensitive files are not tracked
        run: |
          test ! -f .env
          if git ls-files | grep -E '(^|/)(\.env|.*\.log)$'; then echo 'Sensitive/runtime files must not be tracked.'; exit 1; fi

  database-smoke:
    runs-on: ubuntu-latest
    needs: php-checks
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crismaquest_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Import ChronoQuest base schema
        run: mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot crismaquest_ci < sql/finali/chronoquest_italiano.sql
      - name: Apply CrismaQuest database extensions
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot crismaquest_ci < sql/crismaquest/001_core.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot crismaquest_ci < sql/crismaquest/002_saints_seed.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot crismaquest_ci < sql/crismaquest/003_social_economy.sql
      - name: Validate resumable setup and activation
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: crismaquest_ci
          DB_USER: root
          DB_PASSWORD: root
        run: |
          php tests/crismaquest_card_examples.php
          php tests/crismaquest_card_catalog.php
          php tests/crismaquest_gameplay_setup.php
      - name: Verify CrismaQuest tables and catalogues
        run: |
          TABLES=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='crismaquest_ci' AND table_name LIKE 'cq_%';")
          SAINTS=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM crismaquest_ci.cq_saint_cards;")
          EDITIONS=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM crismaquest_ci.cq_card_editions WHERE edition_type='normal';")
          GIFTS=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM crismaquest_ci.cq_gift_catalog WHERE active=1;")
          STEPS=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM crismaquest_ci.cq_journey_steps WHERE active=1;")
          MISSIONS=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM crismaquest_ci.cq_missions WHERE active=1;")
          SPARKS=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM crismaquest_ci.cq_daily_sparks WHERE active=1;")
          BADGES=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM crismaquest_ci.cq_badge_catalog WHERE active=1;")
          CHESTS=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM crismaquest_ci.cq_chest_catalog WHERE active=1;")
          test "$TABLES" -ge 29
          test "$SAINTS" -eq 40
          test "$EDITIONS" -eq 40
          test "$GIFTS" -ge 17
          test "$STEPS" -eq 22
          test "$MISSIONS" -eq 56
          test "$SPARKS" -eq 60
          test "$BADGES" -eq 14
          test "$CHESTS" -eq 9
      - name: Verify migrations are idempotent
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot crismaquest_ci < sql/crismaquest/001_core.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot crismaquest_ci < sql/crismaquest/002_saints_seed.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot crismaquest_ci < sql/crismaquest/003_social_economy.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot crismaquest_ci < sql/crismaquest/004_gameplay.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot crismaquest_ci < sql/crismaquest/005_gameplay_seed.sql
          SAINTS=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM crismaquest_ci.cq_saint_cards;")
          GIFTS=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM crismaquest_ci.cq_gift_catalog WHERE active=1;")
          MISSIONS=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM crismaquest_ci.cq_missions WHERE active=1;")
          SPARKS=$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -Nse "SELECT COUNT(*) FROM crismaquest_ci.cq_daily_sparks WHERE active=1;")
          test "$SAINTS" -eq 40
          test "$GIFTS" -ge 17
          test "$MISSIONS" -eq 56
          test "$SPARKS" -eq 60

      - name: Gameplay trajectory and stress tests
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: crismaquest_ci
          DB_USER: root
          DB_PASSWORD: root
        run: |
          php tests/crismaquest_gameplay_stress.php
          php tests/crismaquest_gameplay_http.php

  build-deploy-package:
    runs-on: ubuntu-latest
    needs: [php-checks, database-smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl
          tools: composer:v2
      - name: Install production dependencies
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress
      - name: Prepare deploy package
        run: |
          rm -rf build
          mkdir -p build
          PACKAGE_ROOT="$(mktemp -d)"
          mkdir -p "$PACKAGE_ROOT/CrismaQuest"
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/.env' --exclude='/build/' --exclude='/public/assets/MathJax-master/' ./ "$PACKAGE_ROOT/CrismaQuest/"
          printf 'CrismaQuest\nCommit: %s\nBuilt: %s UTC\nInstitution: Paróquia Nossa Senhora dos Remédios · Arquidiocese de Fortaleza\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M:%S')" > "$PACKAGE_ROOT/CrismaQuest/BUILD-INFO.txt"
          (cd "$PACKAGE_ROOT" && zip -qr "$GITHUB_WORKSPACE/build/CrismaQuest-deploy.zip" CrismaQuest)
          (cd build && sha256sum CrismaQuest-deploy.zip > CrismaQuest-deploy.sha256)
          mv "$PACKAGE_ROOT/CrismaQuest" build/CrismaQuest
      - name: Validate deploy package
        run: |
          unzip -t build/CrismaQuest-deploy.zip
          test -f build/CrismaQuest/public/index.php
          test -f build/CrismaQuest/public/install.php
          test -f build/CrismaQuest/src/Service/CrismaQuestBootstrapService.php
          test -f build/CrismaQuest/src/Service/CrismaQuestSocialService.php
          test -f build/CrismaQuest/src/Service/CrismaQuestLumenLedgerService.php
          test -f build/CrismaQuest/src/Service/CrismaQuestHomeService.php
          test -f build/CrismaQuest/src/Service/CrismaQuestGameSetupService.php
          test -f build/CrismaQuest/src/Service/CrismaQuestGameService.php
          test -f build/CrismaQuest/src/Service/CrismaQuestRewardService.php
          test -f build/CrismaQuest/src/Controller/CrismaQuestGameController.php
          test -f build/CrismaQuest/public/views/studenti/crismaquestSocial.php
          test -f build/CrismaQuest/public/views/docenti/crismaquestSocialAudit.php
          test -f build/CrismaQuest/routes/crismaquest.php
          test -f build/CrismaQuest/sql/crismaquest/003_social_economy.sql
          test -f build/CrismaQuest/sql/crismaquest/004_gameplay.sql
          test -f build/CrismaQuest/sql/crismaquest/005_gameplay_seed.sql
          test -f build/CrismaQuest/public/views/studenti/crismaquestGame.php
          test -f build/CrismaQuest/public/views/docenti/crismaquestGame.php
          test -f build/CrismaQuest/public/css/crismaquest-game.css
          test -f build/CrismaQuest/vendor/autoload.php
          test ! -d build/CrismaQuest/public/assets/MathJax-master
          test ! -f build/CrismaQuest/.env
          test ! -d build/CrismaQuest/.git
          test ! -d build/CrismaQuest/.github
          (cd build && sha256sum -c CrismaQuest-deploy.sha256)
      - name: Upload approved package
        uses: actions/upload-artifact@v4
        with:
          name: CrismaQuest-deploy-approved
          path: |
            build/CrismaQuest-deploy.zip
            build/CrismaQuest-deploy.sha256
          retention-days: 7
