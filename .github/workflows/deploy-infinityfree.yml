name: Deploy CrismaQuest to InfinityFree

on:
  workflow_dispatch:
    inputs:
      full_deploy:
        description: 'Enviar o pacote completo do app'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - feature/crismaquest-auth-final

concurrency:
  group: crismaquest-infinityfree-production
  cancel-in-progress: true

jobs:
  repair_visuals_now:
    if: ${{ contains(github.event.head_commit.message, '[repair-visuals]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Upload only Francisco, José and saint catalogue
        shell: bash
        env:
          FTP_USER: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for file in \
            public/assets/crismaquest/saints/sao-francisco-assis-user.jpg \
            public/assets/crismaquest/saints/sao-jose-user.jpg \
            config/crismaquest/saints.json
          do
            curl --silent --show-error --fail --retry 3 --retry-delay 1 --ftp-create-dirs \
              --user "${FTP_USER}:${FTP_PASS}" \
              --upload-file "$file" \
              "ftp://ftpupload.net/htdocs/$file"
          done

  validate:
    uses: ./.github/workflows/crismaquest-ci.yml
  deploy:
    needs: validate
    if: ${{ always() && (needs.validate.result == 'success' || contains(github.event.head_commit.message, '[repair-visuals]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide deployment mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          full=false
          repair=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_deploy }}" == "true" ]]; then full=true; fi
          if git log -1 --pretty=%B | grep -q '\[full-deploy\]'; then full=true; fi
          if git log -1 --pretty=%B | grep -q '\[repair-visuals\]'; then repair=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "repair=$repair" >> "$GITHUB_OUTPUT"

      - name: Prepare targeted visual repair
        if: steps.mode.outputs.full != 'true' && steps.mode.outputs.repair == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-fast
          mkdir -p deploy-fast

          copy_file() {
            local file="$1"
            [[ -f "$file" ]] || return 0
            mkdir -p "deploy-fast/$(dirname "$file")"
            cp "$file" "deploy-fast/$file"
          }

          for file in \
            .htaccess \
            public/.htaccess \
            public/index.php \
            routes/web.php \
            routes/crismaquest.php \
            src/Service/CrismaQuestBootstrapService.php \
            src/Service/StudentDashboardService.php \
            public/views/layouts/mainStudLayout.php \
            public/views/studenti/dashboard.php \
            public/views/studenti/classDashboard.php \
            public/views/studenti/journey.php \
            public/views/studenti/crismaquestSocial.php \
            public/views/studenti/badge/index.php \
            public/js/crismaquest-saint-avatars.js \
            public/views/layouts/loginDocLayout.php \
            public/views/layouts/mainDocLayout.php \
            public/views/layouts/loginStudLayout.php \
            public/js/crismaquest-pwa.js \
            public/service-worker.js \
            public/manifest.webmanifest \
            public/assets/fontawesome-7.2/css/all.min.css \
            public/assets/bootstrap-5.3.8/css/bootstrap.min.css \
            public/assets/bootstrap-5.3.8/js/bootstrap.bundle.min.js \
            public/assets/jquery/jquery.min.js
          do
            copy_file "$file"
          done

          while IFS= read -r -d '' file; do copy_file "$file"; done < <(find public/css -maxdepth 1 -type f -name 'crismaquest-*.css' -print0)

          mkdir -p deploy-fast/public/assets
          cp -a public/assets/crismaquest deploy-fast/public/assets/
          mkdir -p deploy-fast/public/assets/fontawesome-7.2
          cp -a public/assets/fontawesome-7.2/webfonts deploy-fast/public/assets/fontawesome-7.2/

          echo "Targeted repair files: $(find deploy-fast -type f | wc -l)"
          find deploy-fast -type f -print | sort

      - name: Confirm current production revision
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/feature/crismaquest-auth-final | cut -f1)" = "$(git rev-parse HEAD)"

      - name: Prepare cumulative release package
        if: steps.mode.outputs.full != 'true' && steps.mode.outputs.repair != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-fast
          # Last verified production baseline. Include every change since it, even across skipped commits.
          baseline=f5da46147a56d8edf203cf5e1623059a7ceb0be1
          git diff --name-only --diff-filter=AM "$baseline" HEAD | while IFS= read -r file; do
            case "$file" in
              .htaccess|public/*|src/*|routes/*|config/*|sql/*|translations/*)
                mkdir -p "deploy-fast/$(dirname "$file")"
                cp "$file" "deploy-fast/$file"
                ;;
            esac
          done
          mkdir -p deploy-fast/public/assets/fontawesome-7.2/css deploy-fast/public/assets/fontawesome-7.2/webfonts
          cp public/assets/fontawesome-7.2/css/all.min.css deploy-fast/public/assets/fontawesome-7.2/css/
          cp public/assets/fontawesome-7.2/webfonts/*.woff2 deploy-fast/public/assets/fontawesome-7.2/webfonts/

      - name: Safe upload-only deploy
        if: steps.mode.outputs.full != 'true'
        shell: bash
        env:
          FTP_USER: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            rel="${file#deploy-fast/}"
            temporary="${rel}.cq-${GITHUB_SHA}"
            encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$temporary")
            echo "Uploading $rel"
            curl --silent --show-error --fail --retry 3 --retry-delay 1 --ftp-create-dirs \
              --user "${FTP_USER}:${FTP_PASS}" \
              --upload-file "$file" \
              --quote "-RNFR ${temporary##*/}" --quote "-RNTO ${rel##*/}" \
              "ftp://ftpupload.net/htdocs/$encoded"
            count=$((count+1))
          done < <(printf '%s\0' deploy-fast/public/index.php; find deploy-fast -type f ! -path 'deploy-fast/routes/*' ! -path 'deploy-fast/public/index.php' ! -path 'deploy-fast/src/Controller/*' ! -path 'deploy-fast/public/views/*' -print0; find deploy-fast/src/Controller deploy-fast/public/views deploy-fast/routes -type f -print0)
          echo "Uploaded $count files without deleting remote files."

      - name: Setup PHP for full deploy
        if: steps.mode.outputs.full == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl
          tools: composer:v2

      - name: Install production dependencies
        if: steps.mode.outputs.full == 'true'
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - name: Prepare full optimized runtime
        if: steps.mode.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp -a .htaccess config public routes sql src translations vendor deploy/
          if [ -d var ]; then cp -a var deploy/; else mkdir -p deploy/var; fi
          rm -rf deploy/public/assets/MathJax-master deploy/public/readme deploy/public/assets/bootstrap/scss
          rm -rf deploy/public/assets/fontawesome-7.2/js deploy/public/assets/fontawesome-7.2/metadata deploy/public/assets/fontawesome-7.2/scss
          rm -rf deploy/public/assets/fontawesome-7.2/sprites deploy/public/assets/fontawesome-7.2/sprites-full deploy/public/assets/fontawesome-7.2/svgs deploy/public/assets/fontawesome-7.2/svgs-full
          find deploy/public/assets/fontawesome-7.2/css -type f ! -name 'all.min.css' -delete 2>/dev/null || true
          find deploy/public/assets/bootstrap-5.3.8/css -type f ! -name 'bootstrap.min.css' -delete 2>/dev/null || true
          find deploy/public/assets/bootstrap-5.3.8/js -type f ! -name 'bootstrap.bundle.min.js' -delete 2>/dev/null || true
          find deploy/public/assets/bootstrap/css -type f ! -name 'bootstrap.min.css' -delete 2>/dev/null || true
          find deploy/public/assets/bootstrap/js -type f ! -name 'bootstrap.bundle.min.js' -delete 2>/dev/null || true
          find deploy -type f \( -name '*.map' -o -name '.DS_Store' -o -name '*.md' -o -name 'cq-health-91f3.php' -o -name 'cq-route-7b3f.php' \) -delete
          echo "Full runtime files: $(find deploy -type f | wc -l)"

      - name: Safe full runtime upload
        if: steps.mode.outputs.full == 'true'
        shell: bash
        env:
          FTP_USER: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            rel="${file#deploy/}"
            encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$rel")
            curl --silent --show-error --fail --retry 3 --retry-delay 1 --ftp-create-dirs \
              --user "${FTP_USER}:${FTP_PASS}" \
              --upload-file "$file" \
              "ftp://ftpupload.net/htdocs/$encoded"
            count=$((count+1))
          done < <(find deploy -type f -print0)
          echo "Uploaded $count runtime files without deleting remote files."
