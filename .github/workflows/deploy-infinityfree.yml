name: Deploy CrismaQuest to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - feature/crismaquest-auth-final

concurrency:
  group: crismaquest-infinityfree-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare priority CrismaQuest files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf priority
          mkdir -p priority/public/views/docenti/modals priority/public/views/docenti/studenti priority/public/views/studenti priority/public/views/layouts priority/public/js/docenti priority/src/Service priority/translations
          cp .htaccess priority/.htaccess
          cp public/.htaccess priority/public/.htaccess
          cp public/install.php priority/public/install.php
          cp public/index.php priority/public/index.php
          cp public/views/layouts/mainDocLayout.php priority/public/views/layouts/mainDocLayout.php
          cp public/views/docenti/classi.php priority/public/views/docenti/classi.php
          cp public/views/docenti/studenti/index.php priority/public/views/docenti/studenti/index.php
          cp public/views/docenti/modals/teacherClassCreateModal.php priority/public/views/docenti/modals/teacherClassCreateModal.php
          cp public/views/docenti/modals/studentManagementModals.php priority/public/views/docenti/modals/studentManagementModals.php
          cp public/views/studenti/classDashboard.php priority/public/views/studenti/classDashboard.php
          cp public/js/docenti/studenti.js priority/public/js/docenti/studenti.js
          cp src/Service/CrismaQuestBootstrapService.php priority/src/Service/CrismaQuestBootstrapService.php
          cp src/Service/TeacherClassService.php priority/src/Service/TeacherClassService.php
          cp src/Service/TranslationService.php priority/src/Service/TranslationService.php
          cp translations/pt.php priority/translations/pt.php
          echo "Priority files: $(find priority -type f | wc -l)"

      - name: Publish priority fixes first
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./priority/
          state-name: .crismaquest-priority-state.json
          timeout: 300000
          log-level: minimal

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - name: Prepare optimized InfinityFree package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp -a .htaccess config public routes sql src translations vendor deploy/
          if [ -d var ]; then cp -a var deploy/; else mkdir -p deploy/var; fi
          rm -rf deploy/public/assets/MathJax-master deploy/public/readme deploy/public/assets/bootstrap/scss
          rm -rf deploy/public/assets/fontawesome-7.2/js deploy/public/assets/fontawesome-7.2/metadata deploy/public/assets/fontawesome-7.2/scss
          rm -rf deploy/public/assets/fontawesome-7.2/sprites deploy/public/assets/fontawesome-7.2/sprites-full deploy/public/assets/fontawesome-7.2/svgs deploy/public/assets/fontawesome-7.2/svgs-full
          find deploy/public/assets/fontawesome-7.2/css -type f ! -name 'all.min.css' -delete 2>/dev/null || true
          find deploy/public/assets/bootstrap-5.3.8/css -type f ! -name 'bootstrap.min.css' -delete 2>/dev/null || true
          find deploy/public/assets/bootstrap-5.3.8/js -type f ! -name 'bootstrap.bundle.min.js' -delete 2>/dev/null || true
          find deploy/public/assets/bootstrap/css -type f ! -name 'bootstrap.min.css' -delete 2>/dev/null || true
          find deploy/public/assets/bootstrap/js -type f ! -name 'bootstrap.bundle.min.js' -delete 2>/dev/null || true
          find deploy -type f \( -name '*.map' -o -name '.DS_Store' -o -name '*.md' \) -delete
          echo "Files to deploy: $(find deploy -type f | wc -l)"
          echo "Package size: $(du -sh deploy | cut -f1)"

      - name: Deploy optimized package to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./deploy/
          state-name: .crismaquest-deploy-state.json
          timeout: 300000
          log-level: minimal
          exclude: |
            **/.env
            **/.git*
