name: Deploy CrismaQuest to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - feature/crismaquest-auth-final
    paths:
      - '.github/workflows/deploy-infinityfree.yml'

concurrency:
  group: crismaquest-infinityfree-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - name: Prepare slim InfinityFree package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp -a .htaccess config public routes sql src translations vendor deploy/
          if [ -d var ]; then cp -a var deploy/; else mkdir -p deploy/var; fi
          rm -rf deploy/public/assets/MathJax-master
          find deploy -type f \( -name '*.map' -o -name '.DS_Store' \) -delete
          echo "Files to deploy: $(find deploy -type f | wc -l)"
          echo "Package size: $(du -sh deploy | cut -f1)"

      - name: Deploy slim package to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./deploy/
          state-name: .crismaquest-deploy-state.json
          timeout: 300000
          log-level: minimal
          exclude: |
            **/.env
            **/.git*
