name: Deploy CrismaQuest to InfinityFree

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - name: Deploy to InfinityFree
        uses: step-security/ftp-deploy-action@v4
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/build/**
            **/.idea/**
            **/.vscode/**
