<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040" role="img" aria-labelledby="title desc">
<title id="title">Mapa da Jornada CrismaQuest</title>
<desc id="desc">Paisagem simbólica de peregrinação com caminho iluminado até uma igreja, representando Pentecostes e a Igreja em missão.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#082737"/><stop offset=".42" stop-color="#174f61"/><stop offset=".72" stop-color="#b47b5c"/><stop offset="1" stop-color="#e5bd75"/></linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163c3a"/><stop offset="1" stop-color="#315f49"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#fff2b6" stop-opacity=".95"/><stop offset=".35" stop-color="#f5c96b" stop-opacity=".55"/><stop offset="1" stop-color="#f5c96b" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="760" height="1040" fill="url(#sky)"/>
<circle cx="560" cy="140" r="165" fill="url(#halo)"/>
<path d="M0 460 C170 360 295 410 420 355 C545 300 640 335 760 290 L760 1040 L0 1040Z" fill="#123635" opacity=".92"/>
<path d="M0 590 C130 500 260 550 390 480 C520 410 650 485 760 430 L760 1040 L0 1040Z" fill="url(#hill)"/>
<path d="M0 760 C135 690 260 730 380 655 C520 570 640 650 760 585 L760 1040 L0 1040Z" fill="#274c3e"/>
<path d="M0 865 C165 810 325 860 475 775 C590 710 665 735 760 700 L760 1040 L0 1040Z" fill="#355941"/>
<!-- River -->
<path d="M610 470 C585 575 630 640 570 718 C525 778 520 845 548 1040" fill="none" stroke="#8db5b0" stroke-width="38" opacity=".45"/>
<path d="M610 470 C585 575 630 640 570 718 C525 778 520 845 548 1040" fill="none" stroke="#bdd4cb" stroke-width="10" opacity=".55"/>
<!-- Pilgrimage path -->
<path d="M148 940 C95 845 212 793 196 710 C181 628 306 606 287 522 C268 441 420 424 398 340 C381 273 515 260 518 182" fill="none" stroke="#7a5228" stroke-width="22" stroke-linecap="round" opacity=".45"/>
<path d="M148 940 C95 845 212 793 196 710 C181 628 306 606 287 522 C268 441 420 424 398 340 C381 273 515 260 518 182" fill="none" stroke="#f3d172" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
<g fill="#fff0a6" filter="url(#glow)"><circle cx="154" cy="923" r="7"/><circle cx="132" cy="838" r="7"/><circle cx="195" cy="760" r="7"/><circle cx="197" cy="687" r="7"/><circle cx="269" cy="620" r="7"/><circle cx="290" cy="544" r="7"/><circle cx="315" cy="474" r="7"/><circle cx="390" cy="414" r="7"/><circle cx="400" cy="339" r="7"/><circle cx="447" cy="286" r="7"/><circle cx="502" cy="236" r="7"/></g>
<!-- Cathedral -->
<g transform="translate(454 98)" filter="url(#glow)">
  <path d="M0 110h128V54h-18V18l-18 22v14H80V0L64 22 48 0v54H36V40L18 18v36H0z" fill="#e1bb70" stroke="#f4db9c" stroke-width="3"/>
